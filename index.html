<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plex Search</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
<style>
  :root {
    color-scheme: light dark;
    --bg: #111111;
    --fg: #eeeeee;
    --muted: #888888;
    --faint: #666666;
    --border: #444444;
    --input-bg: #222222;
    --card-bg: #1e1e1e;
    --btn-bg: #222222;
    --btn-fg: #cccccc;
    --btn-active: #333333;
    --tag-tv-bg: #2a4d69;
    --tag-tv-fg: #bbccdd;
    --tag-movie-bg: #4d2a2a;
    --tag-movie-fg: #ddbbcc;
    --tag-wish-bg: #4d472a;
    --tag-wish-fg: #dddccc;
    --remove-border: #555555;
    --remove-fg: #aaaaaa;
    --add-bg: #2a6b4d;
    --add-bg-active: #1f5038;
    --add-fg: #ffffff;
    --dot-ok: #33aa33;
    --dot-bad: #aa3333;
    --dot-neutral: #666666;
    --stale-fg: #e0a030;
    --panel-shadow: rgba(0, 0, 0, 0.4);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f7;
      --fg: #1a1a1a;
      --muted: #666666;
      --faint: #888888;
      --border: #cccccc;
      --input-bg: #ffffff;
      --card-bg: #ffffff;
      --btn-bg: #ececec;
      --btn-fg: #333333;
      --btn-active: #dddddd;
      --tag-tv-bg: #dbeafe;
      --tag-tv-fg: #1e4d8c;
      --tag-movie-bg: #fde2e2;
      --tag-movie-fg: #9b2c2c;
      --tag-wish-bg: #fef3c7;
      --tag-wish-fg: #8a6a10;
      --remove-border: #cccccc;
      --remove-fg: #555555;
      --add-bg: #2f855a;
      --add-bg-active: #276749;
      --add-fg: #ffffff;
      --dot-ok: #2f855a;
      --dot-bad: #c53030;
      --dot-neutral: #999999;
      --stale-fg: #b45309;
      --panel-shadow: rgba(0, 0, 0, 0.15);
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 16px;
    /* Push content below the notch/status bar (needed because the iOS
       status bar is "black-translucent", i.e. it overlays the page
       instead of pushing it down) and above the home indicator. */
    padding-top: 24px; /* fallback for browsers without safe-area support */
    padding-top: calc(env(safe-area-inset-top, 0px) + 40px); /* extra buffer beyond the raw inset - newer iOS "liquid glass" status bar blur/vibrancy fades further past the exact boundary than older versions did, so it needs more clearance to stop looking fuzzy */
    padding-bottom: max(40px, env(safe-area-inset-bottom) + 24px);
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    background: var(--bg);
    color: var(--fg);
  }
  h1 { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.2; }

  /* #headerWrap anchors the dropdown details panel so it can be
     absolutely positioned under the hamburger button without pushing
     the search box down when it's closed. */
  #headerWrap { position: relative; margin-bottom: 16px; }

  #topBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  #topControls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Two small labeled dots replace the old always-visible status text -
     one for whether the app itself is syncing OK, one for whether the
     library data pulled from the NAS is fresh. Tap the hamburger for
     the actual timestamps behind them. */
  .statusItem {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .statusDot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .statusDot.ok { background: var(--dot-ok); }
  .statusDot.bad { background: var(--dot-bad); }
  .statusDot.neutral { background: var(--dot-neutral); }

  #syncBtn, #menuBtn {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    line-height: 1.4;
  }
  #syncBtn:active, #menuBtn:active { background: var(--btn-active); }
  #menuBtn { font-size: 15px; padding: 3px 9px; }

  #detailsPanel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 230px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 6px 18px var(--panel-shadow);
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    line-height: 1.3;
    color: var(--faint);
    z-index: 20;
  }
  #detailsPanel.hidden { display: none; }
  #detailsPanel #status { color: var(--muted); font-weight: 600; }
  #libraryUpdated.stale { color: var(--stale-fg); font-weight: 600; }
  #appBuild {
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  input#q {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--fg);
  }
  #modeRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    gap: 8px;
  }
  #count { color: var(--muted); font-size: 13px; }
  #modeToggle {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #modeToggle:active { background: var(--btn-active); }

  .result {
    padding: 10px 12px;
    margin-top: 8px;
    border-radius: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .result span:first-child { flex: 1; min-width: 0; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .tv { background: var(--tag-tv-bg); color: var(--tag-tv-fg); }
  .movie { background: var(--tag-movie-bg); color: var(--tag-movie-fg); }
  .wish { background: var(--tag-wish-bg); color: var(--tag-wish-fg); }

  .removeBtn {
    background: none;
    border: 1px solid var(--remove-border);
    color: var(--remove-fg);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
  }

  #empty { color: var(--muted); margin-top: 16px; }
  .addBtn {
    display: block;
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    background: var(--add-bg);
    color: var(--add-fg);
  }
  .addBtn:active { background: var(--add-bg-active); }
</style>
</head>
<body>
  <div id="headerWrap">
    <div id="topBar">
      <h1>Plex Search</h1>
      <div id="topControls">
        <span class="statusItem" title="App sync status">App <span class="statusDot neutral" id="appSyncDot"></span></span>
        <span class="statusItem" title="Library data status">Library <span class="statusDot neutral" id="librarySyncDot"></span></span>
        <button id="syncBtn" type="button">Sync Now</button>
        <button id="menuBtn" type="button" aria-label="Sync details" aria-expanded="false">&#9776;</button>
      </div>
    </div>
    <div id="detailsPanel" class="hidden">
      <div id="status">Loading...</div>
      <div id="lastSync">App never synced yet</div>
      <div id="libraryUpdated">Library data from: unknown</div>
      <div id="appBuild">Checking app version...</div>
    </div>
  </div>

  <input id="q" type="text" placeholder="Search movies &amp; TV shows..." autofocus autocomplete="off">
  <div id="modeRow">
    <div id="count"></div>
    <button id="modeToggle" type="button">View Wishlist</button>
  </div>
  <div id="results"></div>
  <div id="empty" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
