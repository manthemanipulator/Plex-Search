<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Search</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Keep both: apple-mobile-web-app-capable is still what iOS Safari
     actually reads for true standalone (no browser chrome) mode - Apple's
     own docs still require it, with no replacement. mobile-web-app-capable
     is the newer cross-browser version Chrome's console nudges toward;
     adding it alongside costs nothing and quiets that warning without
     touching iOS behavior at all. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
<style>
  :root {
    color-scheme: light dark;
    --bg: #111111;
    --fg: #eeeeee;
    --muted: #888888;
    --faint: #666666;
    --border: #444444;
    --input-bg: #222222;
    --card-bg: #1e1e1e;
    --btn-bg: #222222;
    --btn-fg: #cccccc;
    --btn-active: #333333;
    --chip-active-bg: #3a3a3a;
    --chip-active-fg: #ffffff;
    --tag-tv-bg: #2a4d69;
    --tag-tv-fg: #bbccdd;
    --tag-movie-bg: #4d2a2a;
    --tag-movie-fg: #ddbbcc;
    --tag-book-bg: #2a4d3a;
    --tag-book-fg: #bbddc7;
    --tag-wish-bg: #4d472a;
    --tag-wish-fg: #dddccc;
    --remove-border: #555555;
    --remove-fg: #aaaaaa;
    --add-bg: #2a6b4d;
    --add-bg-active: #1f5038;
    --add-fg: #ffffff;
    --open-bg: #2a4d69;
    --open-bg-active: #1e3a52;
    --open-fg: #ffffff;
    --dot-ok: #33aa33;
    --dot-bad: #aa3333;
    --dot-neutral: #666666;
    --stale-fg: #e0a030;
    --panel-shadow: rgba(0, 0, 0, 0.4);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f7;
      --fg: #1a1a1a;
      --muted: #666666;
      --faint: #888888;
      --border: #cccccc;
      --input-bg: #ffffff;
      --card-bg: #ffffff;
      --btn-bg: #ececec;
      --btn-fg: #333333;
      --btn-active: #dddddd;
      --chip-active-bg: #333333;
      --chip-active-fg: #ffffff;
      --tag-tv-bg: #dbeafe;
      --tag-tv-fg: #1e4d8c;
      --tag-movie-bg: #fde2e2;
      --tag-movie-fg: #9b2c2c;
      --tag-book-bg: #dcf5e3;
      --tag-book-fg: #1f6b3f;
      --tag-wish-bg: #fef3c7;
      --tag-wish-fg: #8a6a10;
      --remove-border: #cccccc;
      --remove-fg: #555555;
      --add-bg: #2f855a;
      --add-bg-active: #276749;
      --add-fg: #ffffff;
      --open-bg: #2a5d8c;
      --open-bg-active: #1e4a70;
      --open-fg: #ffffff;
      --dot-ok: #2f855a;
      --dot-bad: #c53030;
      --dot-neutral: #999999;
      --stale-fg: #b45309;
      --panel-shadow: rgba(0, 0, 0, 0.15);
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 16px;
    /* Push content below the notch/status bar (needed because the iOS
       status bar is "black-translucent", i.e. it overlays the page
       instead of pushing it down) and above the home indicator. */
    padding-top: 24px; /* fallback for browsers without safe-area support */
    padding-top: calc(env(safe-area-inset-top, 0px) + 40px); /* extra buffer beyond the raw inset - newer iOS "liquid glass" status bar blur/vibrancy fades further past the exact boundary than older versions did, so it needs more clearance to stop looking fuzzy */
    padding-bottom: max(40px, env(safe-area-inset-bottom) + 24px);
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    background: var(--bg);
    color: var(--fg);
  }
  h1 { font-size: 24px; font-weight: 700; margin: 0; line-height: 1.2; }

  /* #headerWrap anchors the dropdown details panel so it can be
     absolutely positioned under the hamburger button without pushing
     the search box down when it's closed. */
  #headerWrap { position: relative; margin-bottom: 16px; }

  #topBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  #topControls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Two small labeled dots replace the old always-visible status text -
     one for whether the app itself is syncing OK, one for whether the
     library data pulled in (either side) is fresh. Tap the hamburger for
     the actual timestamps behind them. */
  .statusItem {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .statusDot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .statusDot.ok { background: var(--dot-ok); }
  .statusDot.bad { background: var(--dot-bad); }
  .statusDot.neutral { background: var(--dot-neutral); }

  /* Every tappable control on this page targets a 44px minimum edge
     (Apple's own HIG minimum) - the old versions of these were sized to
     fit their text/icon with a few px of padding, which read as "tiny"
     even though the text itself was legible. */
  #menuBtn {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 18px;
    padding: 10px;
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #menuBtn:active { background: var(--btn-active); }

  /* The hamburger now opens an actual menu (Sync / Wishlist / About)
     instead of a read-only status readout - #menuPanel holds that list;
     #aboutPanel is a second "screen" inside the same dropdown, swapped in
     when About is tapped, so the whole thing stays one small popover
     instead of needing real navigation. */
  #menuPanel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 220px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 6px 18px var(--panel-shadow);
    overflow: hidden;
    z-index: 20;
  }
  #menuPanel.hidden { display: none; }
  #menuList.hidden { display: none; }

  .menuItem {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--fg);
    font-family: inherit;
    padding: 13px 16px;
    min-height: 48px;
  }
  .menuItem:last-child { border-bottom: none; }
  .menuItem:active { background: var(--btn-active); }
  .menuItemLabel { font-size: 15px; font-weight: 600; }
  .menuItemSub { font-size: 12px; color: var(--muted); }

  #aboutPanel {
    padding: 6px 16px 14px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--faint);
  }
  #aboutPanel.hidden { display: none; }
  #aboutBackBtn {
    background: none;
    border: none;
    color: var(--fg);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 0;
    min-height: 36px;
  }
  #status { color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  #libraryUpdated.stale, #audiobookUpdated.stale { color: var(--stale-fg); font-weight: 600; }
  #appBuild {
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  input#q {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--fg);
    min-height: 48px;
  }

  /* Filter chips: which library(s) results come from. Only meaningful in
     search mode - hidden while browsing the wishlist, since that's
     already its own combined, untyped list. */
  #filterRow {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  #filterRow.hidden { display: none; }
  .filterChip {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    min-height: 40px;
    flex: 1;
  }
  .filterChip.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-fg);
    border-color: var(--chip-active-bg);
  }

  #results { margin-top: 6px; }

  .result {
    padding: 14px 16px;
    margin-top: 10px;
    border-radius: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-height: 44px;
  }
  .result .resultMain { flex: 1; min-width: 0; }
  .result .resultTitle { display: block; font-size: 15px; }
  .result .resultSub {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 5px;
    vertical-align: middle;
  }
  .tv { background: var(--tag-tv-bg); color: var(--tag-tv-fg); }
  .movie { background: var(--tag-movie-bg); color: var(--tag-movie-fg); }
  .book { background: var(--tag-book-bg); color: var(--tag-book-fg); }
  .wish { background: var(--tag-wish-bg); color: var(--tag-wish-fg); }
  .otherType { background: var(--btn-bg); color: var(--btn-fg); }

  .removeBtn {
    background: none;
    border: 1px solid var(--remove-border);
    color: var(--remove-fg);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    min-height: 36px;
  }
  .openBtn {
    background: var(--open-bg);
    color: var(--open-fg);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
  }
  .openBtn:active { background: var(--open-bg-active); }

  #empty { color: var(--muted); margin-top: 20px; font-size: 15px; }
  .addPrompt {
    color: var(--muted);
    font-size: 14px;
    margin-top: 16px;
  }
  /* Row of type buttons shown when adding a new wishlist item - reuses
     the exact same colors as the Movie/TV/Audiobook tags elsewhere so a
     "Movie" wishlist button and a "Movie" library tag read as the same
     category at a glance. */
  .addBtnRow {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .addTypeBtn {
    flex: 1 1 auto;
    min-width: 80px;
    padding: 14px 8px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    min-height: 48px;
  }
  .addTypeBtn:active { opacity: 0.8; }
  .addTypeBtn.movie { background: var(--tag-movie-bg); color: var(--tag-movie-fg); }
  .addTypeBtn.tv { background: var(--tag-tv-bg); color: var(--tag-tv-fg); }
  .addTypeBtn.book { background: var(--tag-book-bg); color: var(--tag-book-fg); }
  .addTypeBtn.otherType { background: var(--btn-bg); color: var(--btn-fg); border: 1px solid var(--border); }

  /* Idle state (search mode, no query yet): the old page just left this
     whole area blank until you typed something, which is most of what
     read as "dead space" on a phone screen. These tiles fill it with
     something actually useful (at-a-glance counts) and double as big,
     easy-to-tap shortcuts - tapping Movies/TV/Audiobooks jumps the filter
     chip and focuses the search box, tapping Wishlist opens it directly. */
  .statGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }
  .statCard {
    font-family: inherit;
    cursor: pointer;
    background: var(--card-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: center;
    min-height: 88px;
  }
  .statCard:active { background: var(--btn-active); }
  .statNum { font-size: 26px; font-weight: 700; }
  .statLabel { font-size: 13px; color: var(--muted); }
  .idleHint {
    text-align: center;
    color: var(--faint);
    font-size: 13px;
    margin-top: 18px;
  }
</style>
</head>
<body>
  <div id="headerWrap">
    <div id="topBar">
      <h1>Media Search</h1>
      <div id="topControls">
        <span class="statusItem" title="App sync status">App <span class="statusDot neutral" id="appSyncDot"></span></span>
        <span class="statusItem" title="Library data status">Library <span class="statusDot neutral" id="librarySyncDot"></span></span>
        <button id="menuBtn" type="button" aria-label="Menu" aria-expanded="false">&#9776;</button>
      </div>
    </div>
    <div id="menuPanel" class="hidden">
      <div id="menuList">
        <button id="menuSyncBtn" class="menuItem" type="button">
          <span class="menuItemLabel">Sync Now</span>
          <span class="menuItemSub" id="menuSyncStatus">Ready</span>
        </button>
        <button id="menuWishlistBtn" class="menuItem" type="button">
          <span class="menuItemLabel" id="menuWishlistLabel">Wishlist</span>
          <span class="menuItemSub" id="menuWishlistCount"></span>
        </button>
        <button id="menuAboutBtn" class="menuItem" type="button">
          <span class="menuItemLabel">About</span>
        </button>
      </div>
      <div id="aboutPanel" class="hidden">
        <button id="aboutBackBtn" type="button">&larr; Back</button>
        <div id="status">Loading...</div>
        <div id="lastSync">App never synced yet</div>
        <div id="libraryUpdated">Movies/TV data from: unknown</div>
        <div id="audiobookUpdated">Audiobook data from: unknown</div>
        <div id="appBuild">Checking app version...</div>
      </div>
    </div>
  </div>

  <input id="q" type="text" placeholder="Search movies, TV & audiobooks..." autofocus autocomplete="off">
  <div id="filterRow">
    <button class="filterChip active" type="button" data-filter="all">All</button>
    <button class="filterChip" type="button" data-filter="video">Movies &amp; TV</button>
    <button class="filterChip" type="button" data-filter="audiobook">Audiobooks</button>
  </div>
  <div id="results"></div>
  <div id="empty" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
